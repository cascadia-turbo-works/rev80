[project]
name = "vibechecker"
version = "0.1.0"
description = "A Python toolkit for vibration sensing and logging"
authors = [
    { name="Henry Gotjen", email="hgotjen@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "dearpygui==2.0.0",
    "matplotlib",
    "pyyaml",
    "h5py",
    "plyer",
    "picosdk @ git+https://github.com/picotech/picosdk-python-wrappers.git@5d91a11b67a2c2ff9d6371d459e05e873106a2a3"
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "pyinstaller", "ruff"]

[tool.setuptools.packages.find]
include = ["vibechecker*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = "."

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E402",   # module-level import not at top — intentional in picoscope.py (DLL guard)
    "E701",   # multiple statements on one line — used in from_dict for compact tabular style
]
