[project]
name = "rev80"
version = "0.1.0"
description = "Rev80 — industrial vibration analysis for PicoScope"
authors = [
    { name="Henry Gotjen", email="hgotjen@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "h5py",
    "plyer",
    "pywin32; sys_platform == 'win32'",
    "picosdk @ git+https://github.com/picotech/picosdk-python-wrappers.git@5d91a11b67a2c2ff9d6371d459e05e873106a2a3"
]

[project.scripts]
rev80-headless = "rev80.headless:main"
rev80 = "rev80.__main__:main"

[project.optional-dependencies]
gui = ["dearpygui==2.0.0"]
dev = ["pytest", "ipykernel", "pyinstaller", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py runtime resources that must ship inside the installed package
# (needed for a normal, non-editable `pip install .` — see resource_path()
# in _paths.py). The font is fetched by scripts/fetch_font.sh and is not
# committed to git, so it's only present in built artifacts that ran that
# step first (a source checkout without it still installs, just without
# custom toolbar icon glyphs). The hicolor icon PNGs are small and
# deterministic (regenerated by scripts/make_icons.sh), so they're
# committed directly rather than fetched at build time.
[tool.setuptools.package-data]
rev80 = ["logging.yaml", "assets/fonts/*.otf", "assets/icons/hicolor/*/apps/*.png"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E402",   # module-level import not at top — intentional in picoscope.py (DLL guard)
    "E701",   # multiple statements on one line — used in from_dict for compact tabular style
]
