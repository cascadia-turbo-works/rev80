[project]
name = "rev80"
dynamic = ["version"]
description = "Rev80 — industrial vibration analysis for PicoScope"
authors = [
    { name="Henry Gotjen", email="hgotjen@gmail.com" }
]
readme = "README.md"
# 3.10 is a hard floor. Most modules evaluate annotations at import time
# (no `from __future__ import annotations`), and sensor.py uses `dict | None`,
# which needs 3.10. On 3.9, pip installs and the first import raises TypeError.
requires-python = ">=3.10"
dependencies = [
    # Lower bounds, not exact pins (dearpygui is the one exception). Each bound
    # supports Python 3.10. CI installs the newest releases, so no job tests
    # the bounds themselves.
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "h5py>=3.8",
    "plyer>=2.1",
    # Exact pin: later versions crash the viewport on Windows. Test on Windows
    # before you change it. A required dependency, because gui.py and icons.py
    # import it at module scope.
    "dearpygui==2.0.0",
    "pywin32>=305; sys_platform == 'win32'",
    # Pinned to one commit of the vendor repository. PyPI refuses this form of
    # dependency, so the wheel is a release asset only. Its setup.py loads the
    # native DLLs at install time: CONTRIBUTING.md, section 11.
    "picosdk @ git+https://github.com/picotech/picosdk-python-wrappers.git@5d91a11b67a2c2ff9d6371d459e05e873106a2a3"
]

[project.scripts]
rev80-headless = "rev80.headless:main"
rev80 = "rev80.__main__:main"

[project.optional-dependencies]
# `gui` is an empty alias, so that `pip install rev80[gui]` still works.
# dearpygui is a required dependency.
gui = []
# ruff is bounded because its rule behaviour changes between minor releases.
# `build` is the PEP 517 frontend for `./scripts/build.sh wheel`. Do not run
# `python -m build` from the repository root: CONTRIBUTING.md, section 10.2.
dev = ["pytest", "ipykernel", "pyinstaller", "ruff>=0.15,<0.17", "build"]

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py resources for a non-editable `pip install .` (_paths.resource_path).
# scripts/fetch_font.sh copies the font from the tracked assets/fonts/ into
# src/rev80/assets/fonts/, which is gitignored. Without that step the package
# installs, and the toolbar icons show as boxes. The hicolor PNGs are tracked
# (scripts/make_icons.sh makes them).
[tool.setuptools.package-data]
rev80 = ["logging.yaml", "assets/fonts/*.otf", "assets/icons/hicolor/*/apps/*.png"]

# setuptools_scm writes src/rev80/_version.py from `git describe` at each
# build or install. The file is gitignored. Do not stamp the version in a
# commit hook: a commit cannot describe a tag that is applied after it.
# Only a clean checkout of a tag gets the bare version ("0.1.0"). Other
# commits and dirty trees get a dev, hash or date suffix on purpose.
# Do not add a custom tag_regex. The default parses "vX.Y.Z"; a greedy custom
# regex parsed "v0.1.0" as "1.0". A tag must be a PEP 440 version.
# fallback_version applies when no tag is reachable (a shallow clone). The
# release build jobs fail on it: CONTRIBUTING.md, section 11.
[tool.setuptools_scm]
version_file = "src/rev80/_version.py"
version_file_template = "__version__ = \"{version}\"\n"
fallback_version = "0.0.0+unknown"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit rule set, because ruff's default set changes between releases:
# on one tree, ruff 0.15.10 gave 0 errors and 0.16.5 gave 167. These four
# are the classic defaults. Widen the set only as a separate change.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",   # __init__.py imports after a guarded optional import
    "E701",   # multiple statements on one line (no current use)
]
