name: Release

# Pushing a vX.Y.Z tag builds the Windows installer and the Python wheel and
# attaches both to a DRAFT GitHub Release, for review before publishing.
#
# Two things worth knowing before editing this file:
#
#   1. A tag trigger fires wherever the tag points. GitHub Actions has no
#      notion of "tagged on main" -- any v* tag on any branch builds a
#      release. That is a deliberate choice, not an oversight.
#
#   2. fetch-depth: 0 is load-bearing everywhere below. setuptools_scm
#      derives the version from `git describe`, and the default shallow
#      checkout has no tags reachable, so the version silently becomes
#      0.0.0+unknown and the release ships Rev80Setup-0.0.0+unknown.exe.
#      Both build jobs assert against that rather than trusting it.
#
# The installer built here is DRIVER-LESS: the build passes `nodlls`, so the
# DLLs are not bundled. Users install PicoSDK separately and the installer
# warns them if it is missing. A local ./scripts/build.sh still bundles them.
#
# Note this is now a CHOICE, not a constraint. PicoSDK *is* installed on the
# runner -- it has to be, or the picosdk Python wrapper will not install at all
# (see the long comment on that step). Dropping `nodlls` to ship a
# driver-bundled installer is therefore a one-word change, gated only on the
# Pico redistribution licence.

on:
  push:
    tags: ['v*']
    # TEMPORARY -- remove before merging to main. workflow_dispatch below only
    # becomes usable once this file is on the default branch, so a push trigger
    # is the only way to exercise the Windows job from this branch first.
    branches: ['fix/ci-picosdk']
  # Run the pipeline by hand against any ref, to test it without spending a
  # version number. Only usable once this file has reached the default branch.
  workflow_dispatch:

# gh release create writes to the repo.
permissions:
  contents: write

# Releases must not race each other; unlike CI, do not cancel one in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag must not be able to cut a release from a red tree. Single Python
  # version -- the full matrix already ran on the branch via ci.yml.
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # dearpygui's compiled extension links against libX11 at load time.
      # The suite never creates a viewport, so no GL and no X server needed.
      - name: Install X11 runtime library
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libx11-6

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src/ tests/

      - name: Test
        run: python -m pytest tests/ -q

  wheel:
    name: Wheel + sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only the PEP 517 frontend is needed; build.sh installs the package
      # itself with --no-deps, so numpy/scipy/h5py never get built here.
      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build
        run: ./scripts/build.sh wheel

      - name: Verify version is not the setuptools_scm fallback
        run: |
          ls -l dist/
          if ls dist/ | grep -q '0\.0\.0+unknown'; then
            echo "::error::setuptools_scm fell back to 0.0.0+unknown - no tags reachable. Check fetch-depth: 0."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        # build.sh is bash; Git Bash ships on the Windows runner image and
        # provides the cygpath/taskkill the script already uses.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # This interpreter is frozen into the bundle and shipped to users.
          # Changing it changes what they run -- a deliberate decision, not a
          # routine bump.
          python-version: "3.12"
          architecture: x64
          cache: pip

      # Not preinstalled. Chocolatey puts iscc.exe at
      # C:\Program Files (x86)\Inno Setup 6\, which build.sh's find_iscc()
      # already probes.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # PicoSDK has to be present before pip runs, and not for the reason the
      # rest of this file avoids it. picosdk's own setup.py probes for the
      # native DLLs at INSTALL time and refuses to build without them:
      #
      #     if sys.platform == 'win32':
      #         result = ctypes.WinDLL(find_library(name))   # find_library -> None
      #     ...
      #     except OSError:                                  # TypeError isn't caught
      #     if not atleast1dll: exit(1)                      # and this would fail anyway
      #
      # On Linux the same line is cdll.LoadLibrary(None), which is legal and
      # returns a handle to the main program -- so the probe passes and the
      # ubuntu jobs install fine. That asymmetry is why CI was green for weeks
      # while this job could never have worked.
      #
      # Pre-installing the wrapper does not help: the dependency is a direct
      # git URL, so pip re-clones and re-runs setup.py for metadata regardless.
      #
      # NOTE this is not the same requirement as bundling the DLLs. The build
      # below still passes `nodlls`; this only makes the wrapper installable.
      # The reboot PicoSDK asks for registers the USB *kernel driver*, which
      # matters for talking to a scope and not for loading a user-mode DLL --
      # and no scope is attached here.
      - name: Cache PicoSDK installer
        id: picosdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\PicoSDK.exe
          key: picosdk-x64-11.1.0.481

      - name: Download PicoSDK
        if: steps.picosdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://www.picotech.com/download/software/sr/PicoSDK_x64_11.1.0.481.exe' `
            -OutFile "$env:RUNNER_TEMP\PicoSDK.exe"

      - name: Install PicoSDK
        shell: pwsh
        run: |
          $lib = 'C:\Program Files\Pico Technology\SDK\lib'
          Write-Host '--- silent install ---'
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\PicoSDK.exe" `
                 -ArgumentList '/quiet','/norestart' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"

          if (-not (Test-Path $lib)) {
            # Fall back to extracting the bundle rather than installing it.
            # 7z is preinstalled on windows-latest. This needs no registry
            # entries and no reboot -- setup.py only has to LoadLibrary a file.
            Write-Host '--- lib dir absent; extracting instead ---'
            $lib = "$env:RUNNER_TEMP\picosdk-lib"
            & 7z e "$env:RUNNER_TEMP\PicoSDK.exe" -o"$lib" -y `
                'ps4000a.dll' 'picoipp.dll' -r | Select-Object -Last 5
          }

          if (-not (Test-Path $lib)) {
            Write-Host '::error::PicoSDK produced no lib directory by either route.'
            exit 1
          }
          Get-ChildItem $lib -Filter '*.dll' | Select-Object Name,Length
          # Persist for later steps: find_library() searches PATH.
          Add-Content -Path $env:GITHUB_PATH -Value $lib

      # This is picosdk's exact precondition, checked before pip so a failure
      # names the cause instead of surfacing as a TypeError inside a build
      # subprocess.
      - name: Verify the wrapper's install-time probe will pass
        shell: pwsh
        run: |
          $found = python -c "from ctypes.util import find_library; print(find_library('ps4000a'))"
          Write-Host "find_library('ps4000a') -> $found"
          if ($found -eq 'None' -or [string]::IsNullOrWhiteSpace($found)) {
            Write-Host '::error::ps4000a.dll not on PATH - picosdk setup.py would exit(1).'
            exit 1
          }
          python -c "import ctypes; ctypes.WinDLL(r'$found'); print('WinDLL load OK')"

      # The dev extra carries PyInstaller. picosdk installs from a pinned git
      # URL (pip needs git, present on the image); the native PicoSDK driver
      # is deliberately absent.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build installer (driver-less)
        run: ./scripts/build.sh all nodlls

      - name: Verify version is not the setuptools_scm fallback
        run: |
          ls -l installer/Output/
          if ls installer/Output/ | grep -q '0\.0\.0+unknown'; then
            echo "::error::setuptools_scm fell back to 0.0.0+unknown - no tags reachable. Check fetch-depth: 0."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Output/Rev80Setup-*.exe
          if-no-files-found: error

  release:
    name: Draft release
    needs: [wheel, installer]
    runs-on: ubuntu-latest
    # Tags only. A branch push or a manual dispatch still builds and uploads
    # artifacts -- which is the point of testing -- but must never publish a
    # draft release named after a branch.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # No `name:` -- downloads every artifact, each into its own directory.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts/
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            artifacts/installer/*.exe \
            artifacts/wheel/*
